x-env: &env
  env_file:
    - ${ENV_FILE:-.env}

services:
  app:
    <<: [ *env ]
    container_name: dash-app
    build:
      dockerfile: Dockerfile
    restart: always
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
    networks:
      - dash
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - LRU_CACHE_MAXSIZE=128

  db:
    <<: [ *env ]
    image: postgres:18.1-alpine
    container_name: dash-app-db
    restart: always
    ports:
      - target: 5432
        published: 6432
        protocol: tcp
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - dash

volumes:
  postgres-data:
    name: dash-db-data

networks:
  dash:
    name: dash
    driver: bridge
