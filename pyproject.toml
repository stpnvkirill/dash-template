[project]
name = "dash-template"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dash[compress]>=4.0.0",
    "python-dotenv>=1.2.1",
    "orjson>=3.11.7",
    "pydantic>=2.12.5",
    "dash-iconify>=0.1.2",
    "dash-mantine-components>=2.5.1",
    "sqlalchemy>=2.0.46",
    "alembic>=1.18.4",
    "psycopg[binary]>=3.3.2",
    "flask-login>=0.6.3",
    "user-agents>=2.2.0",
    "gunicorn>=25.1.0",
    "python-json-logger>=4.0.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.0",
    "pytest>=9.0.2",
    "ruff>=0.14.8",
]

[tool.ruff]
line-length = 88
target-version = "py314"
fix = true

[tool.ruff.lint]
select = [
  "E",      # pycodestyle errors
  "W",      # pycodestyle warnings
  "F",      # Pyflakes
  "I",      # isort
  "UP",     # pyupgrade
  "B",      # flake8-bugbear
  "SIM",    # flake8-simplify
  "C4",     # flake8-comprehensions
  "TID",    # flake8-tidy-imports
  "ARG",    # flake8-unused-arguments
  "PTH",    # flake8-use-pathlib
  "RUF",    # Ruff-specific rules
  "S",      # flake8-bandit (security)
  "G",      # flake8-logging-format
  "A",      # flake8-builtins
  "FA",     # flake8-future-annotations
  "PERF",   # perflint
]
ignore = [
  "S101",   # assert statements (allowed in tests)
  "S104",   # hardcoded bind address (development)
  "S106",   # hardcoded passwords (development)
  "G004",   # logging f-string (acceptable for structured logs)
  "A002",   # builtin argument shadowing (common in SQLAlchemy)
  "C901",   # function complexity (complex business logic is acceptable)
  "PLR0913", # too many arguments (DI pattern with explicit dependencies)
  "BLE001", # blind except Exception (valid for middleware error handling)
  "PLC0415", # import outside top-level (lazy loading in functions)
]


[tool.ruff.lint.isort]
known-first-party = []
combine-as-imports = true
force-single-line = false
force-sort-within-sections = true
force-wrap-aliases = true
order-by-type = true


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"


[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"
multiline-quotes = "double"
docstring-quotes = "double"
avoid-escape = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = [
  "S101",
  "PT001",
  "PT002",
  "PT003",
]

"alembic/**/*.py" = ["ALL"]
"**/alembic/*.py" = ["ALL"]
